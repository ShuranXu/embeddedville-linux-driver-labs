name: Publish Linux driver toolchain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".devcontainer/Dockerfile"
      - "runtime/**"
      - ".github/workflows/publish-toolchain.yml"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: linux-driver-toolchain
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/shuranxu/embeddedville-linux-driver-toolchain
          tags: |
            type=raw,value=2026.10
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Verify the published runtime
        env:
          IMAGE: ghcr.io/shuranxu/embeddedville-linux-driver-toolchain@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE" bash -lc 'grep -Fx linux=6.18.57 /opt/embeddedville/toolchain-release; qemu-system-x86_64 --version | grep -F 11.1.2; test -s /opt/embeddedville/guest/bzImage; test -s /opt/embeddedville/guest/initramfs.cpio.gz; test -f /opt/embeddedville/linux-6.18.57/include/config/kernel.release'
          printf 'Toolchain image `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
